<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Vida · Pide tu canción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17102b; --panel:#221a3d; --line:#3a2f5e; --ink:#f4eefc; --mute:#a99dc9;
  --pink:#ff3d9a; --amber:#ffb627; --teal:#34e5d3; --bad:#ff7a7a;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.wordmark{font-family:Bungee,Outfit,sans-serif;font-size:clamp(24px,8vw,34px);color:var(--pink);text-shadow:0 0 6px var(--pink),0 0 20px rgba(255,61,154,.5)}
.sign{font-family:Bungee,Outfit,sans-serif;font-size:14px;color:var(--amber)}
h2{font-size:22px;font-weight:800;margin-bottom:12px}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--mute)}
input{font:inherit;width:100%;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:6px}
input:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-color:var(--teal)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:15px;background:var(--pink);color:#fff;cursor:pointer;font-size:17px;
  box-shadow:0 0 18px rgba(255,61,154,.4)}
button:disabled{opacity:.55;cursor:default;box-shadow:none}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.msg{min-height:1.4em;font-size:15px;line-height:1.4}
.msg.ok{color:var(--teal)} .msg.err{color:var(--bad)}
section.queue{margin-top:28px}
ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:baseline;line-height:1.3}
li.now{border-color:var(--pink);box-shadow:0 0 14px rgba(255,61,154,.3)}
.n{color:var(--teal);font-weight:800;min-width:1.8em}
.t{overflow-wrap:anywhere}
.by{color:var(--mute);font-size:13px}
.tag{color:var(--amber);font-weight:600;font-size:13px}
.empty{color:var(--mute);line-height:1.5}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.1)}}
</style>
</head>
<body>
<header>
  <div class="wordmark">RADIO VIDA</div>
  <div class="sign">by DREW</div>
</header>

<h2>Pide tu canción</h2>
<form id="f" autocomplete="off">
  <div>
    <label for="link">Enlace de YouTube</label>
    <input id="link" type="url" inputmode="url" placeholder="https://youtu.be/..." required>
  </div>
  <div>
    <label for="nick">Tu nombre (opcional)</label>
    <input id="nick" type="text" maxlength="30" placeholder="Ej: Andrea">
  </div>
  <button id="btn" type="submit" disabled>Conectando…</button>
  <p class="msg" id="msg" role="status"></p>
</form>

<section class="queue">
  <h2>En la cola</h2>
  <ol id="list"></ol>
  <p class="empty" id="empty">Nadie ha pedido nada todavía. Pega el primer enlace y empieza la fiesta.</p>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvHgvlmRgg-Ag2RisJveVAvk3WCfZlmAc",
  authDomain: "rockola-drew.firebaseapp.com",
  databaseURL: "https://rockola-drew-default-rtdb.firebaseio.com",
  projectId: "rockola-drew",
  storageBucket: "rockola-drew.firebasestorage.app",
  messagingSenderId: "207525604927",
  appId: "1:207525604927:web:b718523c79ff6f326d128a"
};
const COOLDOWN_MS = 8000;   // espera mínima entre pedidos del mismo celular

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let items = [];
let lastSent = 0;

function say(text, kind){ const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }

/* Extrae el ID de 11 caracteres de cualquier enlace de YouTube */
function videoId(raw){
  let u;
  try { u = new URL(raw.trim()); } catch { return null; }
  const host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
  let id = null;
  if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
  else if (host === "youtube.com"){
    if (u.pathname === "/watch") id = u.searchParams.get("v");
    else { const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/); if (m) id = m[1]; }
  }
  return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
}

/* Título y validación de que el video se puede reproducir embebido */
async function lookup(id){
  const url = "https://www.youtube.com/oembed?format=json&url=" +
    encodeURIComponent("https://www.youtube.com/watch?v=" + id);
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) return { ok: false };
    const j = await r.json();
    return { ok: true, titulo: (j.title || "").slice(0, 150) };
  } catch {
    // Sin respuesta (red o bloqueo): se acepta con un título genérico
    return { ok: true, titulo: "Canción (" + id + ")" };
  }
}

function render(){
  const ol = $("list"); ol.textContent = "";
  items.forEach((it, idx) => {
    const li = document.createElement("li");
    const playing = it.estado === "reproduciendo";
    if (playing) li.className = "now";
    const n = document.createElement("span"); n.className = "n"; n.textContent = playing ? "♪" : idx + (items[0] && items[0].estado === "reproduciendo" ? 0 : 1);
    const t = document.createElement("span"); t.className = "t"; t.textContent = it.titulo;
    li.append(n, t);
    if (playing){ const g = document.createElement("span"); g.className = "tag"; g.textContent = "sonando"; li.append(g); }
    else if (it.por){ const b = document.createElement("span"); b.className = "by"; b.textContent = "· " + it.por; li.append(b); }
    ol.append(li);
  });
  $("empty").style.display = items.length ? "none" : "block";
}

onAuthStateChanged(auth, user => {
  if (!user) return;
  $("btn").disabled = false; $("btn").textContent = "Agregar a la cola";
  onValue(ref(db, "queue"), snap => {
    const arr = [];
    snap.forEach(c => { arr.push({ key: c.key, ...c.val() }); });
    arr.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    items = arr; render();
  });
});
signInAnonymously(auth).catch(() => { $("btn").textContent = "Sin conexión"; say("No se pudo conectar. Revisa tu internet y recarga.", "err"); });

try { $("nick").value = localStorage.getItem("rockola_nick") || ""; } catch {}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const id = videoId($("link").value);
  if (!id) return say("Ese enlace no parece de YouTube. Copia el enlace con el botón Compartir del video.", "err");
  if (items.some(i => i.vid === id)) return say("Esa canción ya está en la cola.", "err");
  const wait = COOLDOWN_MS - (Date.now() - lastSent);
  if (wait > 0) return say("Espera " + Math.ceil(wait / 1000) + " segundos para pedir otra.", "err");

  const btn = $("btn"); btn.disabled = true; btn.textContent = "Buscando…"; say("");
  const info = await lookup(id);
  if (!info.ok){
    btn.disabled = false; btn.textContent = "Agregar a la cola";
    return say("Ese video no se puede reproducir en Radio Vida. Prueba con otra versión.", "err");
  }
  const por = $("nick").value.trim().slice(0, 30);
  try { localStorage.setItem("rockola_nick", por); } catch {}
  try {
    const registro = { vid: id, titulo: info.titulo || ("Canción (" + id + ")"), estado: "pendiente", ts: serverTimestamp() };
    if (por) registro.por = por;
    await push(ref(db, "queue"), registro);
    lastSent = Date.now();
    $("link").value = "";
    say("Listo: «" + info.titulo + "» entró a la cola.", "ok");
  } catch {
    say("No se pudo agregar. Intenta de nuevo en unos segundos.", "err");
  }
  btn.disabled = false; btn.textContent = "Agregar a la cola";
});
</script>
</body>
</html>
